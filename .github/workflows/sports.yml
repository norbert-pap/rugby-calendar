name: Refresh cycling and darts calendars
on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sports.py
      - test_sports.py
      - merge.py
      - requirements.txt
      - .github/workflows/sports.yml
permissions:
  contents: write
concurrency:
  group: rugby-calendar-refresh
  cancel-in-progress: false
jobs:
  refresh:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sport: [cycling, darts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python sports.py ${{ matrix.sport }}
      - name: Publish verified calendar
        env:
          SPORT: ${{ matrix.sport }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SPORT.ics" "$SPORT-status.json"
          if ! git diff --cached --quiet; then
            git commit -m "Refresh $SPORT calendar"
            git push
          fi
