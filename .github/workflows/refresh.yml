name: Refresh rugby calendar
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - merge.py
      - watch.py
      - test_watch.py
      - test_merge.py
      - requirements.txt
      - .github/workflows/refresh.yml
permissions:
  contents: write
concurrency:
  group: rugby-calendar-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python merge.py
        env:
          WATCH_PROVIDER_JSON: ${{ secrets.WATCH_PROVIDER_JSON }}
      - name: Publish verified calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rugby.ics status.json sources
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh combined rugby fixtures'
            git pull --rebase
            git push
          fi
